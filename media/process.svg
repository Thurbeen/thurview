<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-labelledby="title desc">
  <title id="title">How a thurview review runs</title>
  <desc id="desc">Two rows of six steps. A local branch: the agent pins the base and head as exact commits, writes the walkthrough with every claim anchored to a line range, and publishes, which checks every anchor and seals a revision; you read it in the browser, ask questions the agent answers in the same thread, and decide. Approving ends the review; requesting changes loops back to the agent, which fixes, re-pins and publishes again. An opened pull or merge request, with thurview-pr-review: check the publishing setup, review the change, seal the page, deploy a public snapshot, edit one summary on the forge that links it, and wait for a push. A new head goes round again; a merged, closed or stopped change request ends it. Dashes run along the two loops and stop when reduced motion is preferred.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; }
    .stage { fill: #f6f8fa; stroke: #e1e6eb; }
    .stage-key { fill: #f0f7ff; stroke: #b6e3ff; }
    .card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.25; }
    .card-key { fill: #ffffff; stroke: #0969da; stroke-width: 2; }
    .flow { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .loop { fill: none; stroke: #0969da; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .motion { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 3 21; animation: process-flow 12s linear infinite; }
    .head-flow { fill: #818b98; }
    .head-loop { fill: #0969da; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
    .lede { font-size: 13px; fill: #59636e; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #59636e; }
    .eyebrow-key { fill: #0969da; }
    .name { font-size: 13.5px; font-weight: 600; }
    .sub { font-size: 11px; fill: #59636e; }
    .cmd { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; fill: #59636e; }
    .label { font-size: 11.5px; font-weight: 600; fill: #0969da; }
    .muted { font-size: 11.5px; fill: #59636e; }
    .pass { font-size: 11.5px; font-weight: 600; fill: #1a7f37; }
    @keyframes process-flow { to { stroke-dashoffset: -288; } }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .stage { fill: #151b23; stroke: #262c36; }
      .stage-key { fill: #0b1d33; stroke: #1f4b7f; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .card-key { fill: #0d1117; stroke: #4493f8; }
      .flow { stroke: #9198a1; }
      .loop { stroke: #4493f8; }
      .motion { stroke: #0d1117; }
      .head-flow { fill: #9198a1; }
      .head-loop { fill: #4493f8; }
      text { fill: #f0f6fc; }
      .lede, .sub, .eyebrow, .muted, .cmd { fill: #9198a1; }
      .eyebrow-key, .label { fill: #4493f8; }
      .pass { fill: #3fb950; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none; stroke-dashoffset: 0; opacity: 0; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-flow" d="M0 1 L9 5 L0 9 z"/></marker>
    <marker id="a-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-loop" d="M0 1 L9 5 L0 9 z"/></marker>
  </defs>

  <!-- Card, so the diagram reads on any page background. -->
  <rect class="bg" x="1" y="1" width="858" height="438" rx="16"/>

  <text class="h1" x="40" y="44">thurview</text>
  <text class="lede" x="40" y="66">The agent pins the change and writes the review; you read it in the browser, ask, and decide.</text>

  <!--
    Layout: six cards per row, 116 wide, 18 apart, from x 40. Row one is a local
    branch, row two an opened PR or MR. Each row's blue loop runs under its
    cards, from the last one back to the step that goes again.
  -->

  <!-- Row one: a local branch -->
  <rect class="stage" x="30" y="92" width="402" height="112" rx="14"/>
  <text class="eyebrow" x="40" y="112">AGENT</text>
  <text class="muted" x="424" y="112" text-anchor="end">in your repository</text>
  <rect class="stage stage-key" x="434" y="92" width="404" height="112" rx="14"/>
  <text class="eyebrow eyebrow-key" x="444" y="112">YOU</text>
  <text class="muted" x="828" y="112" text-anchor="end">in the browser</text>

  <rect class="card" x="40" y="124" width="116" height="62" rx="10"/>
  <text class="name" x="50" y="144">1 Pin</text>
  <text class="sub" x="50" y="160">base and head as</text>
  <text class="sub" x="50" y="174">exact commits</text>
  <rect class="card" x="174" y="124" width="116" height="62" rx="10"/>
  <text class="name" x="184" y="144">2 Write</text>
  <text class="sub" x="184" y="160">each claim anchored</text>
  <text class="sub" x="184" y="174">to a line range</text>
  <rect class="card" x="308" y="124" width="116" height="62" rx="10"/>
  <text class="name" x="318" y="144">3 Publish</text>
  <text class="sub" x="318" y="160">checks each anchor,</text>
  <text class="sub" x="318" y="174">seals a revision</text>
  <rect class="card" x="442" y="124" width="116" height="62" rx="10"/>
  <text class="name" x="452" y="144">4 Read</text>
  <text class="sub" x="452" y="160">walkthrough, diff,</text>
  <text class="sub" x="452" y="174">map</text>
  <rect class="card" x="576" y="124" width="116" height="62" rx="10"/>
  <text class="name" x="586" y="144">5 Ask</text>
  <text class="sub" x="586" y="160">answered in the</text>
  <text class="sub" x="586" y="174">same thread</text>
  <rect class="card-key" x="710" y="124" width="116" height="62" rx="10"/>
  <text class="name" x="720" y="144">6 Decide</text>
  <text class="pass" x="720" y="160">approve: done</text>
  <text class="sub" x="720" y="174">or request changes</text>

  <path class="flow" d="M156 155 H172" marker-end="url(#a-flow)"/>
  <path class="flow" d="M290 155 H306" marker-end="url(#a-flow)"/>
  <path class="flow" d="M424 155 H440" marker-end="url(#a-flow)"/>
  <path class="flow" d="M558 155 H574" marker-end="url(#a-flow)"/>
  <path class="flow" d="M692 155 H708" marker-end="url(#a-flow)"/>

  <!-- Requested changes go back to the agent, which fixes, re-pins and publishes again. -->
  <path class="loop" d="M768 186 V214 Q768 222 760 222 H106 Q98 222 98 214 V190" marker-end="url(#a-loop)"/>
  <path class="motion" d="M768 186 V214 Q768 222 760 222 H106 Q98 222 98 214 V194"/>
  <text class="label" x="433" y="240" text-anchor="middle">request changes: the agent fixes, re-pins and publishes again</text>

  <!-- Row two: an opened PR or MR -->
  <text class="eyebrow" x="40" y="284">AN OPENED PR OR MR</text>
  <text class="cmd" x="828" y="284" text-anchor="end">thurview-pr-review</text>

  <rect class="card" x="40" y="296" width="116" height="62" rx="10"/>
  <text class="name" x="50" y="316">Check setup</text>
  <text class="cmd" x="50" y="332">publish-static</text>
  <text class="cmd" x="50" y="346">--check</text>
  <rect class="card" x="174" y="296" width="116" height="62" rx="10"/>
  <text class="name" x="184" y="316">Review</text>
  <text class="sub" x="184" y="332">all of it, then</text>
  <text class="sub" x="184" y="346">what a push moved</text>
  <rect class="card" x="308" y="296" width="116" height="62" rx="10"/>
  <text class="name" x="318" y="316">Seal the page</text>
  <text class="cmd" x="318" y="332">publish --pass</text>
  <rect class="card" x="442" y="296" width="116" height="62" rx="10"/>
  <text class="name" x="452" y="316">Snapshot</text>
  <text class="cmd" x="452" y="332">publish-static</text>
  <text class="cmd" x="452" y="346">--to cloudflare</text>
  <rect class="card" x="576" y="296" width="116" height="62" rx="10"/>
  <text class="name" x="586" y="316">One summary</text>
  <text class="sub" x="586" y="332">on the forge, edited</text>
  <text class="cmd" x="586" y="346">pr-review sync</text>
  <rect class="card" x="710" y="296" width="116" height="62" rx="10"/>
  <text class="name" x="720" y="316">Wait for a push</text>
  <text class="cmd" x="720" y="332">pr-review wait</text>

  <path class="flow" d="M156 327 H172" marker-end="url(#a-flow)"/>
  <path class="flow" d="M290 327 H306" marker-end="url(#a-flow)"/>
  <path class="flow" d="M424 327 H440" marker-end="url(#a-flow)"/>
  <path class="flow" d="M558 327 H574" marker-end="url(#a-flow)"/>
  <path class="flow" d="M692 327 H708" marker-end="url(#a-flow)"/>

  <!-- A new head goes round again. -->
  <path class="loop" d="M768 358 V386 Q768 394 760 394 H240 Q232 394 232 386 V362" marker-end="url(#a-loop)"/>
  <path class="motion" d="M768 358 V386 Q768 394 760 394 H240 Q232 394 232 386 V366"/>
  <text class="label" x="500" y="412" text-anchor="middle">a new head: review it again</text>
  <text class="muted" x="40" y="412">merged, closed or stopped: done. No local server runs.</text>
</svg>
