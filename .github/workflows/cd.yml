# Release on push to main: cocogitto decides from the conventional commits
# whether a version is due, tags it, writes the GitHub release from the
# changelog and publishes the package to npm with provenance.
#
# npm publish uses trusted publishing (OIDC): configure this repository and
# workflow as a trusted publisher of the `thurview` package on npmjs.com once,
# then set the repository variable NPM_PUBLISH=true; no token is stored here.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 1.0.0). Empty = auto from commits."
        required: false
        default: ""
        type: string
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Tag, release, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true
      - name: Decide the version
        id: version
        env:
          FORCED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$FORCED" ]; then
            echo "version=$FORCED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A fix or feat that touches only CI, docs or demo media bumps nothing
          # a user installs, so it must not cut a release. Only the shipped
          # files count: what the npm package carries plus its lockfile.
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            SHIPPED="$(git diff --name-only "$LAST_TAG" HEAD -- src bin skills package.json pnpm-lock.yaml | head -1)"
            if [ -z "$SHIPPED" ]; then
              echo "No shipped file changed since $LAST_TAG; not releasing."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # cog prints the next tag (v0.2.0) among notes such as "Pre-Hooks and
          # Post-Hooks have been skipped", and exits non-zero when nothing bumps.
          # Keep only the tag and drop its prefix: package.json wants 0.2.0.
          RAW="$(cog bump --auto --disable-bump-commit --dry-run 2>/dev/null || true)"
          NEXT="$(printf '%s\n' "$RAW" | grep -oE '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$' | tail -1 || true)"
          if [ -n "$NEXT" ]; then
            echo "version=${NEXT#v}" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits since the last tag."
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      # Tag without a bump commit and push only the tag: main takes changes
      # through pull requests only, so nothing here may push a commit to it.
      # package.json keeps its last committed version; the publish step sets
      # the released one in the job's working copy before building.
      - name: Create the version tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cog bump --version "$VERSION" --disable-bump-commit
          git push origin "refs/tags/v$VERSION"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.version.outputs.version != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.version.outputs.version != ''
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Build at the released version
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          pnpm install --frozen-lockfile
          pnpm build
      # Needs the one-time npm trusted-publisher setup for this workflow; the
      # repository variable NPM_PUBLISH=true turns the step on once that is done.
      - name: Publish to npm
        if: steps.version.outputs.version != '' && vars.NPM_PUBLISH == 'true'
        run: npm publish --provenance --access public
      - name: GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cog changelog --at "v$VERSION" > /tmp/notes.md || true
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md
