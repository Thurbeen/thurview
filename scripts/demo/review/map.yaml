  - { id: svc, kind: system, label: Session service, description: "Login, logout and, from this change, an audit trail." }
  - { id: svc.auth, kind: container, label: Auth, description: Entry points login() and logout(), files: ["src/auth.ts"], anchor: login }
  - { id: svc.store, kind: component, label: Session store, description: sessions.json read and written whole, files: ["src/store.ts"], anchor: loadSessions }
  - { id: svc.audit, kind: component, label: Audit trail, description: Appends one JSON line per event to audit.log, files: ["src/audit.ts"], anchor: auditFn }
edges:
